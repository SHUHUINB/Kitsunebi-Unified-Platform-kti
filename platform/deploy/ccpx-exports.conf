# /etc/tmpfiles.d/ccpx-exports.conf
#
# WPE 落盘导出（/opt/ccpx/exports）的清理规则。
#
# 为什么需要：落盘导出是「导出完整 hex」的正路，一次整个缓冲可以几十 MB。
# 实测一次 73 条 = 约 0.96 MB，抓满 4000 条时单文件可到 8 MB+。
# 没有清理机制的话，反复导出会把磁盘吃满 —— 而磁盘满的表现是
# 「适配层忽然写不了导出」，排查时不会有人想到是磁盘。
#
# 规则：保留 14 天。e 只清理**内容**，不删目录本身（目录属主是 ccpx）。
# 14 天是拍的 —— 要改就改这个数，别去改适配层代码。
#
# 生效：
#     sudo cp ccpx-exports.conf /etc/tmpfiles.d/
#     sudo systemd-tmpfiles --clean
# 查看将要清什么（不实际删）：
#     sudo systemd-tmpfiles --clean --dry-run

e /opt/ccpx/exports - - - 14d
